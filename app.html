<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>무료 썸네일 제작기 | ThumbPick</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--ink:#171717;--muted:#737373;--line:#e8e8e8;--panel:#fff;--bg:#f7f7f4;--accent:#ff6b4a;--radius:20px}*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.top{height:66px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.brand{font-weight:900;display:flex;align-items:center;gap:9px}.mark{width:32px;height:32px;border-radius:10px;background:#111;color:#fff;display:grid;place-items:center;font-size:12px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-weight:800}.primary{background:#111;color:#fff;border-color:#111}.layout{max-width:1480px;margin:auto;display:grid;grid-template-columns:370px minmax(420px,1fr) 285px;gap:17px;padding:17px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius)}.controls{padding:17px;position:sticky;top:83px;align-self:start;max-height:calc(100vh - 100px);overflow:auto}.section{padding:4px 0 17px;border-bottom:1px solid #eee;margin-bottom:14px}.section:last-child{border:0}.section h3{font-size:13px;margin:4px 0 10px}.label{display:block;font-size:11px;color:#777;font-weight:800;margin:8px 0 5px}.field,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 11px;outline:none;background:#fff}textarea{min-height:72px;resize:vertical}.field:focus,textarea:focus{border-color:#888}.smart{background:#171717;color:#fff;border-radius:15px;padding:13px;margin-top:10px}.smart-head{display:flex;justify-content:space-between;align-items:center}.smart small{color:#aaa;font-size:9px}.smart button{border:0;background:#d9ff67;border-radius:9px;padding:7px 9px;font-size:10px;font-weight:900}.ideas{margin-top:9px;display:none}.idea{background:#292929;border:1px solid #393939;border-radius:9px;padding:9px;margin-top:6px;font-size:11px;line-height:1.45;cursor:pointer}.idea:hover{border-color:#d9ff67}.templates{display:grid;grid-template-columns:1fr 1fr;gap:7px}.template{height:72px;border:2px solid transparent;border-radius:11px;padding:9px;text-align:left;position:relative;overflow:hidden}.template.active{border-color:#111}.template strong{font-size:11px;display:block}.template span{font-size:9px;opacity:.65}.upload{display:block;border:1.5px dashed #ccc;border-radius:12px;padding:13px;text-align:center;font-size:12px;color:#777;cursor:pointer}.upload input{display:none}.swatches{display:flex;gap:7px;margin-top:8px}.swatch{width:28px;height:28px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #ddd}.swatch.active{box-shadow:0 0 0 2px #111}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.range{display:flex;align-items:center;gap:7px}.range input{width:100%}.range output{font-size:10px;color:#888}.stage{min-height:calc(100vh - 100px);padding:28px;display:grid;place-items:center;background-image:radial-gradient(#ddd 1px,transparent 1px);background-size:18px 18px}.shell{width:min(100%,740px);aspect-ratio:1;filter:drop-shadow(0 20px 35px rgba(0,0,0,.12))}.shell canvas{width:100%;height:100%;border-radius:9px;display:block}.side{padding:17px;position:sticky;top:83px;align-self:start}.side h3{font-size:15px;margin:0 0 6px}.side p{font-size:11px;line-height:1.65;color:#777}.pro{background:#171717;color:#fff;border-radius:15px;padding:15px;margin-top:14px}.pro small{color:#ffb6a5;font-weight:900}.pro h4{margin:5px 0}.pro ul{font-size:11px;color:#ccc;line-height:1.8;padding-left:17px}.ad{height:170px;border:1px dashed #ccc;border-radius:13px;margin-top:12px;display:grid;place-items:center;text-align:center;color:#aaa;font-size:10px;background:#fafafa}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,15px);background:#111;color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;opacity:0;transition:.2s;z-index:99}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:1100px){.layout{grid-template-columns:340px 1fr}.side{display:none}}@media(max-width:760px){.layout{display:flex;flex-direction:column;padding:9px}.stage{order:1;min-height:auto;padding:17px}.controls{order:2;position:static;max-height:none}.actions .back{display:none}}
</style></head><body>
<header class="top"><a class="brand" href="index.html"><span class="mark">TP</span>ThumbPick <small style="font-size:9px;color:#aaa">EDITOR</small></a><div class="actions"><a class="btn back" href="index.html">← 홈</a><button class="btn primary" id="topDownload">PNG 저장</button></div></header>
<main class="layout"><aside class="panel controls">
<div class="section"><h3>1. 제목 & 스마트 문구</h3><label class="label">블로그 글 제목 또는 썸네일 제목</label><textarea id="title">주식 초보자를 위한 스윙과 단타 차이 쉽게 정리</textarea><div class="smart"><div class="smart-head"><div><b style="font-size:11px">✨ 스마트 문구 추천</b><br><small>무료 베타 · 외부 AI 호출 없음</small></div><button id="smartBtn">3개 추천</button></div><div class="ideas" id="ideas"></div></div><label class="label">작은 설명</label><input class="field" id="sub" value="헷갈렸던 개념을 한 번에 정리했어요"><label class="label">카테고리</label><input class="field" id="badge" value="주식 STUDY LOG"></div>
<div class="section"><h3>2. 템플릿</h3><div class="templates" id="templates"><button class="template active" data-t="editorial" style="background:#f4efe7"><strong>에디토리얼</strong><span>정보 · 매거진</span></button><button class="template" data-t="bold" style="background:#ffd94a"><strong>볼드</strong><span>강조 · 정보</span></button><button class="template" data-t="soft" style="background:#dfeade"><strong>소프트</strong><span>육아 · 일상</span></button><button class="template" data-t="dark" style="background:#171717;color:#fff"><strong>다크</strong><span>IT · 주식</span></button><button class="template" data-t="photo" style="background:#88756a;color:#fff"><strong>포토</strong><span>맛집 · 여행</span></button><button class="template" data-t="clean" style="background:#fff;border-color:#e5e5e5"><strong>클린</strong><span>리뷰 · 제품</span></button></div></div>
<div class="section"><h3>3. 사진 & 컬러</h3><label class="upload">📷 사진 업로드 · JPG/PNG/WEBP<input id="image" type="file" accept="image/*"></label><div class="swatches" id="swatches"><button class="swatch active" data-c="#ff6b4a" style="background:#ff6b4a"></button><button class="swatch" data-c="#f0c62f" style="background:#f0c62f"></button><button class="swatch" data-c="#3c6df0" style="background:#3c6df0"></button><button class="swatch" data-c="#63a27b" style="background:#63a27b"></button><button class="swatch" data-c="#8a6de9" style="background:#8a6de9"></button></div></div>
<div class="section"><h3>4. 글자</h3><div class="row"><select id="font"><option value="Noto Sans KR">고딕</option><option value="Gowun Dodum">손글씨</option><option value="Arial">영문</option></select><select id="align"><option value="left">왼쪽 정렬</option><option value="center">가운데 정렬</option></select></div><label class="label">제목 크기</label><div class="range"><input id="size" type="range" min="60" max="120" value="88"><output id="sizeOut">88</output></div></div>
<div class="section"><h3>5. 저장</h3><div class="row"><select id="format"><option value="png">PNG 고화질</option><option value="jpeg">JPG 가벼움</option></select><button class="btn primary" id="download">다운로드</button></div></div>
</aside><section class="panel stage"><div class="shell"><canvas id="canvas" width="1080" height="1080"></canvas></div></section><aside class="panel side"><h3>완성되면 바로 저장하세요.</h3><p>현재 무료 베타에서는 다운로드 횟수 제한이 없습니다.</p><div class="pro"><small>PRO · COMING SOON</small><h4>반복 작업을 자동화</h4><ul><li>AI 문구 추천 고급형</li><li>프리미엄 템플릿 50+</li><li>내 브랜드 프리셋</li><li>썸네일 일괄 생성</li></ul></div><div class="ad">ADVERTISEMENT AREA<br>무료 사용자 광고 영역 후보</div></aside></main><div class="toast" id="toast"></div>
<script>
(()=>{const $=id=>document.getElementById(id),c=$('canvas'),x=c.getContext('2d');const s={t:'editorial',accent:'#ff6b4a',img:null,font:'Noto Sans KR',align:'left',size:88};const themes={editorial:['#f4efe7','#151515','#68615b'],bold:['#ffd94a','#151515','#5d5013'],soft:['#dfeade','#203128','#52665a'],dark:['#171717','#fff','#bbb'],photo:['#877469','#fff','#eee'],clean:['#fff','#151515','#777']};
function contrast(h){let q=h.slice(1),r=parseInt(q.slice(0,2),16),g=parseInt(q.slice(2,4),16),b=parseInt(q.slice(4),16);return(r*299+g*587+b*114)/1000>150?'#111':'#fff'}function rr(a,b,w,h,r,col){x.beginPath();x.roundRect(a,b,w,h,r);x.fillStyle=col;x.fill()}function cover(img,a,b,w,h){let ir=img.width/img.height,rrr=w/h,dw,dh;if(ir>rrr){dh=h;dw=dh*ir}else{dw=w;dh=dw/ir}x.drawImage(img,a+(w-dw)/2,b+(h-dh)/2,dw,dh)}function wrap(txt,max,fs,weight=900){x.font=`${weight} ${fs}px '${s.font}'`;let out=[],line='';for(const ch of [...txt]){let test=line+ch;if(x.measureText(test).width>max&&line){out.push(line);line=ch}else line=test}if(line)out.push(line);return out}
function badge(a,b,col){let text=$('badge').value||'BLOG';x.font=`800 21px '${s.font}'`;let w=Math.min(x.measureText(text).width+35,400);rr(a,b,w,46,23,s.accent);x.fillStyle=contrast(s.accent);x.fillText(text,a+17,b+30)}function title(a,b,w,col,scale=1){let raw=$('title').value.trim()||'제목을 입력하세요',lines=[];raw.split(/\n/).forEach(v=>lines.push(...wrap(v,w,s.size*scale)));lines=lines.slice(0,4);x.fillStyle=col;x.font=`900 ${s.size*scale}px '${s.font}'`;x.textAlign=s.align;let ax=s.align==='center'?a+w/2:a,yy=b;for(let l of lines){x.fillText(l,ax,yy);yy+=s.size*scale*1.22}x.textAlign='left'}function sub(a,b,w,col){let text=$('sub').value;if(!text)return;x.fillStyle=col;x.font=`500 27px '${s.font}'`;x.textAlign=s.align;let ax=s.align==='center'?a+w/2:a;wrap(text,w,27,500).slice(0,2).forEach((l,i)=>x.fillText(l,ax,b+i*40));x.textAlign='left'}
async function draw(){await document.fonts.ready;let [bg,ink,muted]=themes[s.t];x.clearRect(0,0,1080,1080);x.fillStyle=bg;x.fillRect(0,0,1080,1080);if(s.t==='editorial'){if(s.img){x.save();x.beginPath();x.roundRect(570,90,420,900,36);x.clip();cover(s.img,570,90,420,900);x.restore()}else{rr(690,90,300,900,36,s.accent);x.globalAlpha=.82;rr(750,150,240,780,30,'#fff');x.globalAlpha=1}badge(85,100,ink);title(85,290,440,ink,1);sub(88,800,430,muted)}else if(s.t==='bold'){if(s.img){x.globalAlpha=.14;cover(s.img,0,0,1080,1080);x.globalAlpha=1}x.fillStyle=s.accent;x.fillRect(0,0,1080,20);badge(80,90,ink);title(80,300,900,ink,1.12);sub(83,860,850,muted)}else if(s.t==='soft'){if(s.img){x.save();x.beginPath();x.roundRect(100,100,880,430,35);x.clip();cover(s.img,100,100,880,430);x.restore();badge(130,130,'#fff');title(100,670,880,ink,.9);sub(103,920,850,muted)}else{badge(85,100,ink);title(85,350,900,ink,1);sub(88,820,850,muted)}}else if(s.t==='dark'){x.fillStyle=s.accent;x.fillRect(70,70,9,940);if(s.img){x.globalAlpha=.35;cover(s.img,600,0,480,1080);x.globalAlpha=1}badge(115,110,ink);title(115,350,780,ink,1.04);sub(118,870,740,muted)}else if(s.t==='photo'){if(s.img)cover(s.img,0,0,1080,1080);else{let g=x.createLinearGradient(0,0,1080,1080);g.addColorStop(0,'#c9b4a2');g.addColorStop(1,'#65554f');x.fillStyle=g;x.fillRect(0,0,1080,1080)}let g=x.createLinearGradient(0,400,0,1080);g.addColorStop(0,'transparent');g.addColorStop(1,'rgba(0,0,0,.72)');x.fillStyle=g;x.fillRect(0,350,1080,730);badge(75,85,ink);title(75,690,920,ink,.92);sub(78,945,900,muted)}else{if(s.img){x.save();x.beginPath();x.roundRect(650,90,340,340,28);x.clip();cover(s.img,650,90,340,340);x.restore()}x.fillStyle=s.accent;x.fillRect(75,85,70,8);badge(75,145,ink);title(75,380,850,ink,1);sub(78,850,850,muted)}}
function smart(){let raw=$('title').value.replace(/\s+/g,' ').trim();if(!raw)return;let cleaned=raw.replace(/쉽게|정리|알아보기|총정리|완벽|방법|위한|대해서|대한/g,'').replace(/\s+/g,' ').trim();let words=cleaned.split(' ').filter(Boolean);let key=words.slice(0,Math.min(5,words.length)).join(' ');let pair=words.slice(0,2).join(' ');let arr=[`${key}\n한 번에 정리`,`${pair}\n이것만은 꼭 알자`,`${pair}\n초보도 쉽게 이해하기`];let box=$('ideas');box.innerHTML='';arr.forEach(v=>{let d=document.createElement('div');d.className='idea';d.innerText=v;d.onclick=()=>{$('title').value=v;draw();toast('추천 문구를 적용했어요')};box.appendChild(d)});box.style.display='block'}
function download(){let f=$('format').value,m=f==='jpeg'?'image/jpeg':'image/png',a=document.createElement('a');a.download=`thumbpick-${Date.now()}.${f==='jpeg'?'jpg':'png'}`;a.href=c.toDataURL(m,.93);a.click();toast('1080×1080 이미지로 저장했어요')}let timer;function toast(m){let t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),1800)}
['title','sub','badge'].forEach(id=>$(id).oninput=draw);$('smartBtn').onclick=smart;$('templates').onclick=e=>{let b=e.target.closest('.template');if(!b)return;document.querySelectorAll('.template').forEach(v=>v.classList.remove('active'));b.classList.add('active');s.t=b.dataset.t;draw()};$('swatches').onclick=e=>{let b=e.target.closest('.swatch');if(!b)return;document.querySelectorAll('.swatch').forEach(v=>v.classList.remove('active'));b.classList.add('active');s.accent=b.dataset.c;draw()};$('image').onchange=e=>{let f=e.target.files[0];if(!f)return;let i=new Image();i.onload=()=>{s.img=i;draw();toast('사진을 적용했어요')};i.src=URL.createObjectURL(f)};$('font').onchange=e=>{s.font=e.target.value;draw()};$('align').onchange=e=>{s.align=e.target.value;draw()};$('size').oninput=e=>{s.size=+e.target.value;$('sizeOut').value=e.target.value;draw()};$('download').onclick=download;$('topDownload').onclick=()=>{$('format').value='png';download()};draw()})();
</script></body></html>
